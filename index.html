<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>숫자 맞히기 게임</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: #1f2937;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      width: 320px;
    }
    input, button {
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    input {
      width: 80%;
    }
    button {
      cursor: pointer;
      background: #3b82f6;
      color: white;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>숫자 맞히기</h1>
    <p>1부터 100 사이 숫자를 맞혀보세요.</p>
    <input id="guess" type="number" placeholder="숫자 입력" />
    <br />
    <button onclick="check()">확인</button>
    <p id="msg"></p>
    <p id="tries">시도: 0</p>
  </div>

  <script>
    let answer = Math.floor(Math.random() * 100) + 1;
    let tries = 0;

    function check() {
      const input = document.getElementById("guess");
      const msg = document.getElementById("msg");
      const triesText = document.getElementById("tries");
      const guess = Number(input.value);

      if (!guess || guess < 1 || guess > 100) {
        msg.textContent = "1~100 사이 숫자를 입력하세요.";
        return;
      }

      tries++;
      triesText.textContent = "시도: " + tries;

      if (guess < answer) {
        msg.textContent = "더 큰 숫자입니다.";
      } else if (guess > answer) {
        msg.textContent = "더 작은 숫자입니다.";
      } else {
        msg.textContent = `정답! ${tries}번 만에 맞혔습니다.`;
      }

      input.value = "";
      input.focus();
    }
  </script>
</body>
</html>
